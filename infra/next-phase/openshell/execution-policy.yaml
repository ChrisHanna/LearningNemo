version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /bin
    - /lib
    - /lib64
    - /etc
  read_write:
    - /tmp

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  remediation:
    name: LearningNeMo approved remediation
    endpoints:
      - host: __REMEDIATION_HOST__
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/remediations/execute
    binaries:
      - path: /usr/bin/curl

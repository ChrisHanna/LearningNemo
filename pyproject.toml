[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64"]

[project]
name = "agents"
version = "0.1.0"
description = "LearningNeMo secured agent lab built with NVIDIA NeMo Agent Toolkit"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "fastapi>=0.141,<1",
    "httpx>=0.28,<1",
    "nvidia-nat[guardrails,langchain]~=1.9",
    "nemoguardrails[sdd]>=0.21,<0.22",
    "msal>=1.34,<2",
    "mssql-python==1.15.0",
    "uvicorn>=0.40,<1",
]

[project.entry-points.'nat.components']
task_agent = "task_agent.register"

[project.scripts]
learningnemo = "task_agent.console.app:main"
nemo-test-console = "task_agent.console.app:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "sqlfluff==3.4.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"task_agent.console" = ["static/*.html", "static/*.css", "static/*.js", "static/vendor/*"]
